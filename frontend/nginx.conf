# Kitchen ERP web service: the built SPA, the API reverse proxy, and map tiles.
# The browser sees a single origin, so the session cookie is first-party and no
# CORS configuration is needed anywhere.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets. Binary tiles and images are left alone.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # API: pass the request through unchanged. proxy_pass without a URI part
    # forwards the original path, so /api/v1/... reaches the api service as-is.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Receipt uploads arrive in Phase 2; allow a phone photograph.
        client_max_body_size 32m;
    }

    # PMTiles extract, bind-mounted from data/tiles/. PMTiles clients fetch
    # byte ranges; nginx serves ranges from static files by default (max_ranges
    # is unlimited and Accept-Ranges is sent automatically), so nothing here may
    # disable that. Tiles change rarely and are large: cache for a day.
    location /tiles/ {
        alias /tiles/;
        types { application/octet-stream pmtiles; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
    }

    # Hashed build assets are immutable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is the SPA with history fallback. index.html must be
    # revalidated so a new deploy is picked up on the next navigation.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
