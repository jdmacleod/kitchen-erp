# Kitchen ERP web service: the built SPA, the API reverse proxy, and map tiles.
# The browser sees a single origin, so the session cookie is first-party and no
# CORS configuration is needed anywhere.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets. Binary tiles and images are left alone.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # API: pass the request through unchanged.
    location /api/ {
        # Re-resolve `api` at request time instead of once at startup.
        #
        # A literal hostname in proxy_pass is resolved when the config loads and
        # then cached for the life of the worker. `docker compose up -d api`
        # gives the container a new address, so nginx kept dialling the old one
        # and served 502/504 for ever against a backend that was perfectly
        # healthy -- `curl` straight to the api answered 200 while every request
        # through nginx failed, until `web` was restarted too.
        #
        # 127.0.0.11 is Docker's embedded DNS, which is where a Compose service
        # name resolves; ipv6=off because the default bridge network has no
        # IPv6 and the AAAA lookup only adds latency to every request.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        # $request_uri is explicit here on purpose: a proxy_pass whose value
        # comes from a variable does NOT append the original URI the way a
        # literal one does, so dropping it would send every call to /.
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Bounds what proxy_read_timeout does not: reaching the upstream at all.
        # A stopped `api` container does not refuse the connection, it silently
        # drops the SYN, so connect() hangs rather than failing; measured, every
        # request then costs exactly this timeout, and on the 60s default the
        # browser waits a minute for a deployment whose backend is simply not
        # running (issue #25).
        #
        # 3s, not less: it is the handshake being bounded, which on a
        # single-host deployment completes in under a millisecond when the API
        # is up, and an API that is still booting refuses the connection
        # immediately rather than hanging. Nothing healthy is near this.
        proxy_connect_timeout 3s;
        # Receipt uploads arrive in Phase 2; allow a phone photograph.
        client_max_body_size 32m;
    }

    # PMTiles extract, bind-mounted from data/tiles/. PMTiles clients fetch
    # byte ranges; nginx serves ranges from static files by default (max_ranges
    # is unlimited and Accept-Ranges is sent automatically), so nothing here may
    # disable that. Tiles change rarely and are large: cache for a day.
    location /tiles/ {
        alias /tiles/;
        types { application/octet-stream pmtiles; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
    }

    # Hashed build assets are immutable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is the SPA with history fallback. index.html must be
    # revalidated so a new deploy is picked up on the next navigation.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
