# markdownlint (CODING_STANDARDS.md, docs): a relaxed set. What is off, and why:
config:
  default: true
  MD013: false # line length: prose is not wrapped to a fixed width
  MD033: false # inline HTML: DESIGN.md and the README use it on purpose
  MD029: false # ordered-list numbers: the specs number steps across interruptions
  MD036: false # emphasis as a heading: bold lead-ins label paragraphs in the specs
  MD040: false # fence language: plain trees, commands and receipts need none
  MD060: false # table pipe spacing: compact `|---|` tables are the house style
  MD037: false # spaces in emphasis: misreads `MS* > EV-*`-style text, and its fix damages it
  MD038: false # spaces in code: `XMP ` is a four-byte chunk name; its fix would change it
  MD041: false # first-line heading: the pull-request template starts at "##" on purpose
  MD024:
    siblings_only: true # the same subheading under different sections is fine
gitignore: true
ignores:
  - "**/node_modules/**"
