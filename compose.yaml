services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: kerp_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      POSTGRES_DB: kerp
      KERP_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kerp_owner -d kerp"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  api:
    build:
      context: ./backend
      # Compose has NO command substitution: these resolve only from the
      # environment, which the Makefile exports and CI sets. A bare
      # `docker compose up -d --build` falls back to the defaults and the UI
      # says "dev", which is honest rather than wrong. Use `make up`.
      args: &build-args
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    environment: &app-env
      DATABASE_URL: postgresql+asyncpg://kerp_app:${DB_APP_PASSWORD}@db:5432/kerp
      MIGRATION_DATABASE_URL: postgresql+asyncpg://kerp_owner:${DB_OWNER_PASSWORD}@db:5432/kerp
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-gpt-oss:20b}
      ENABLE_OVERPASS: ${ENABLE_OVERPASS:-false}
      ENABLE_NOMINATIM: ${ENABLE_NOMINATIM:-false}
      TILES_PATH: /data/tiles
      RECEIPTS_PATH: /data/receipts
      RECIPES_PATH: /data/recipes
      HOUSEHOLD_TIMEZONE: ${HOUSEHOLD_TIMEZONE:-America/Los_Angeles}
      CURRENCY: ${CURRENCY:-USD}
      INGEST_LOCK_TIMEOUT_SECONDS: ${INGEST_LOCK_TIMEOUT_SECONDS:-600}
      INGEST_STALL_MINUTES: ${INGEST_STALL_MINUTES:-10}
      # Everything .env.example documents has to be forwarded here or setting
      # it does nothing: the container sees only what this block names, and the
      # application falls back to its code defaults in silence.
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-5}
      LLM_LINES_SECONDS_PER_LINE: ${LLM_LINES_SECONDS_PER_LINE:-3}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      OCR_ADAPTERS: ${OCR_ADAPTERS:-["client","tesseract"]}
      INGEST_MAX_ATTEMPTS: ${INGEST_MAX_ATTEMPTS:-5}
      INGEST_BACKOFF_BASE_SECONDS: ${INGEST_BACKOFF_BASE_SECONDS:-5}
      INGEST_BACKOFF_FACTOR: ${INGEST_BACKOFF_FACTOR:-4}
      INGEST_BACKOFF_MAX_SECONDS: ${INGEST_BACKOFF_MAX_SECONDS:-300}
      INGEST_LOCATION_RADIUS_M: ${INGEST_LOCATION_RADIUS_M:-300}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
      - ${RECIPES_PATH:-../cooklang-recipes}:/data/recipes:ro
      - ./docs:/srv/docs:ro   # the checked-in capture contract, for the drift test
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: ./backend
      # Same image contents as api, built separately; without these the worker
      # would report a different identity than the API from `kerp --version`.
      args: *build-args
    command: ["kerp", "worker"]
    environment: *app-env
    volumes:
      - ./data:/data
      - ${RECIPES_PATH:-../cooklang-recipes}:/data/recipes:ro
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: ./frontend
    volumes:
      - ./data/tiles:/tiles:ro
    depends_on:
      - api
    ports:
      # Every interface by default: the point of the UI is capturing receipts from
      # a phone on the same network. Set WEB_BIND=127.0.0.1 to keep it local.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  db-data:
  ollama-data:
