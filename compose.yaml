services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: kerp_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      POSTGRES_DB: kerp
      KERP_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kerp_owner -d kerp"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  api:
    build: ./backend
    environment: &app-env
      DATABASE_URL: postgresql+asyncpg://kerp_app:${DB_APP_PASSWORD}@db:5432/kerp
      MIGRATION_DATABASE_URL: postgresql+asyncpg://kerp_owner:${DB_OWNER_PASSWORD}@db:5432/kerp
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-gpt-oss:20b}
      OCR_ADAPTER: ${OCR_ADAPTER:-tesseract}
      ENABLE_OVERPASS: ${ENABLE_OVERPASS:-false}
      ENABLE_NOMINATIM: ${ENABLE_NOMINATIM:-false}
      TILES_PATH: /data/tiles
      RECEIPTS_PATH: /data/receipts
      RECIPES_PATH: /data/recipes
      HOUSEHOLD_TIMEZONE: ${HOUSEHOLD_TIMEZONE:-America/Los_Angeles}
      CURRENCY: ${CURRENCY:-USD}
      INGEST_LOCK_TIMEOUT_SECONDS: ${INGEST_LOCK_TIMEOUT_SECONDS:-600}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
      - ${RECIPES_PATH:-../cooklang-recipes}:/data/recipes:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: ./backend
    command: ["kerp", "worker"]
    environment: *app-env
    volumes:
      - ./data:/data
      - ${RECIPES_PATH:-../cooklang-recipes}:/data/recipes:ro
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: ./frontend
    volumes:
      - ./data/tiles:/tiles:ro
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  db-data:
  ollama-data:
