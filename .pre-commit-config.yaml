# Install with `pre-commit install`, or `make setup`.
# Never bypass these with `git commit --no-verify`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # A receipt photograph is 1–5 MB; nothing this repo legitimately commits is.
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=no"]
      - id: check-yaml
        # Lockfiles are multi-document YAML and the compose overrides use Compose's
        # own !override tag; neither is hand-edited YAML this hook is for.
        exclude: ^(frontend/pnpm-lock\.yaml|e2e/pnpm-lock\.yaml|compose\.(demo|e2e)\.yaml)$
      - id: check-toml
      - id: check-json

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ruff reads backend/pyproject.toml for backend/ and tools/ruff.toml (which
  # extends it) for tools/: one rule set for both.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9  # matches backend/uv.lock
    hooks:
      - id: ruff
        files: ^(backend|tools)/
      - id: ruff-format
        files: ^(backend|tools)/

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.30.1  # matches the CI "Repo hygiene" job
    hooks:
      - id: zizmor
        files: ^\.github/workflows/

  # Markdown: .markdownlint-cli2.yaml (no line length, inline HTML allowed).
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  # CI only (`pre-commit run --hook-stage manual editorconfig-checker`): the
  # formatters already own most of what it checks in the files they cover.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        stages: [manual]

  - repo: local
    hooks:
      - id: no-data-dir
        name: refuse files under data/, reference/, or a clone
        entry: python3 -m tools.no_data_dir
        language: system
        pass_filenames: true

      - id: scan-pii
        name: scan for personal data
        entry: python3 -m tools.scan_pii
        language: system
        pass_filenames: true

      # Size limits (CODING_STANDARDS.md, size and complexity): fails a new file
      # past the fail limit or a baselined file that grew; warns past the warning size.
      - id: size
        name: file size limits
        entry: python3 -m tools.check_size --files
        language: system
        types_or: [python, ts, tsx]

      # Prettier and ESLint run from the pinned node_modules in frontend/ and e2e/
      # (`corepack pnpm install` there first); tools/pnpm_hook.sh passes the paths.
      # One Prettier for both packages: the same version is pinned in each.
      - id: prettier
        name: prettier (frontend, e2e)
        entry: tools/pnpm_hook.sh frontend prettier --write --ignore-path ../.prettierignore --
        language: system
        files: ^(frontend|e2e)/.*\.(ts|tsx|js|mjs|cjs|css|json|html)$

      - id: eslint-frontend
        name: eslint (frontend)
        entry: tools/pnpm_hook.sh frontend eslint --max-warnings=0 --
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        require_serial: true

      - id: eslint-e2e
        name: eslint (e2e)
        entry: tools/pnpm_hook.sh e2e eslint --max-warnings=0 --
        language: system
        files: ^e2e/.*\.ts$
        require_serial: true
