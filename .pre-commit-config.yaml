# Install with `pre-commit install`, or `make setup`.
# Never bypass these with `git commit --no-verify`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # A receipt photograph is 1–5 MB; nothing this repo legitimately commits is.
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=no"]
      - id: check-yaml
        # Lockfiles are multi-document YAML and the compose overrides use Compose's
        # own !override tag; neither is hand-edited YAML this hook is for.
        exclude: ^(frontend/pnpm-lock\.yaml|e2e/pnpm-lock\.yaml|compose\.(demo|e2e)\.yaml)$
      - id: check-toml
      - id: check-json

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        files: ^(backend|tools)/
      - id: ruff-format
        files: ^(backend|tools)/

  - repo: local
    hooks:
      - id: no-data-dir
        name: refuse files under data/, reference/, or a clone
        entry: python3 -m tools.no_data_dir
        language: system
        pass_filenames: true

      - id: scan-pii
        name: scan for personal data
        entry: python3 -m tools.scan_pii
        language: system
        pass_filenames: true

      # Size limits (CODING_STANDARDS.md, size and complexity): fails a new file
      # past the fail limit or a baselined file that grew; warns past the warning size.
      - id: size
        name: file size limits
        entry: python3 -m tools.check_size --files
        language: system
        types_or: [python, ts, tsx]
