# Install with `pre-commit install`, or `make setup`.
# Never bypass these with `git commit --no-verify`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # A receipt photograph is 1–5 MB; nothing this repo legitimately commits is.
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        files: ^(backend|tools)/
      - id: ruff-format
        files: ^(backend|tools)/

  - repo: local
    hooks:
      - id: no-data-dir
        name: refuse files under data/, reference/, or a clone
        entry: python3 -m tools.no_data_dir
        language: system
        pass_filenames: true

      - id: scan-pii
        name: scan for personal data
        entry: python3 -m tools.scan_pii
        language: system
        pass_filenames: true
