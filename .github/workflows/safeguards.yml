name: PII safeguards

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gitleaks-action lists the pull request's commits through the API to work out
  # what to scan. Without this it fails with 403 "Resource not accessible by
  # integration" on every pull request, including Dependabot's — which looks
  # exactly like a secret being found. Read is all it needs; comments are off
  # below, and a Dependabot run gets a read-only token regardless.
  pull-requests: read

jobs:
  safeguards:
    name: PII safeguards
    runs-on: ubuntu-latest
    env:
      KERP_DENYLIST_SALT: ${{ secrets.KERP_DENYLIST_SALT }}
    steps:
      # Full history: a contributor who commits a real receipt and then amends
      # it away must still be caught before merge.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The literal tier keys on a salt this repository never stores. With the
      # secret present the digests in tools/denylist.hashes become live; a fork's
      # pull request gets no secret and falls back to the regex tier, which is
      # what every run did before the digests existed.
      - name: Prove the denylist digests and the salt agree
        if: env.KERP_DENYLIST_SALT != ''
        run: python -m tools.denylist --self-test

      - name: Report which denylist tier is running
        run: python -m tools.denylist --status

      - name: Scan the checkout
        run: python -m tools.scan_pii

      - name: Scan the history introduced by this PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python -m tools.scan_pii --history "origin/${{ github.base_ref }}..HEAD"

      - name: Scan the full history
        if: github.event_name == 'push'
        run: python -m tools.scan_pii --history

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A finding belongs in the job log, not in a comment on the pull
          # request: posting it needs write access the token does not have on a
          # Dependabot or fork run, and quoting a leaked secret into a comment
          # publishes it a second time.
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Refuse tracked files under data/ or a reference clone
        run: |
          tracked=$(git ls-files -- data backups output reference 'data.bak-*' \
            cookcli grocy kitchenowl mealie paprika-recipes || true)
          if [ -n "$tracked" ]; then
            echo "Tracked files under a forbidden directory:"; echo "$tracked"; exit 1
          fi

      - name: Refuse stray data-shaped files
        run: |
          # Mirrors the suffix denials in .gitignore. Every one of these is a shape
          # real receipt or purchase data arrives in AND a format the scanner cannot
          # read, so a miss here is a miss everywhere. Keep the lists in step.
          stray=$(git ls-files \
            '*.csv' '*.tsv' '*.pdf' '*.zip' '*.7z' '*.rar' '*.tar' '*.tar.gz' '*.tgz' \
            '*.xls' '*.xlsx' '*.ods' '*.doc' '*.docx' '*.eml' '*.mbox' \
            '*.sqlite' '*.sqlite3' '*.db' '*.dump' '*.pgdump' '*.backup' \
            '*.png' '*.jpg' '*.jpeg' '*.heic' '*.heif' '*.webp' '*.gif' '*.tif' '*.tiff' '*.bmp' \
            '*.pmtiles' '*.mbtiles' '*.osm.pbf' \
            | grep -v '^frontend/public/' | grep -v '^docs/screenshots/' || true)
          if [ -n "$stray" ]; then
            echo "Data-shaped files committed outside an allowed directory:"; echo "$stray"; exit 1
          fi

      - name: Refuse large files under frontend/public/
        run: |
          # frontend/public/ is the one re-inclusion in .gitignore. It holds icons.
          # A receipt photograph is far larger than 64 KB.
          big=$(git ls-files frontend/public | while read -r f; do
            [ -f "$f" ] && [ "$(wc -c < "$f")" -gt 65536 ] && echo "$f"; done || true)
          if [ -n "$big" ]; then
            echo "Files over 64 KB under frontend/public/:"; echo "$big"; exit 1
          fi

      - name: Refuse oversized or unexpected files under docs/screenshots/
        run: |
          # The other re-inclusion. These are UI screenshots of the synthetic demo
          # household, produced by `make screenshots`; nothing else belongs here and
          # a photograph of real data would be far larger than a flat UI capture.
          bad=$(git ls-files docs/screenshots | grep -v '\.png$' || true)
          if [ -n "$bad" ]; then
            echo "Non-PNG files under docs/screenshots/:"; echo "$bad"; exit 1
          fi
          big=$(git ls-files docs/screenshots | while read -r f; do
            [ -f "$f" ] && [ "$(wc -c < "$f")" -gt 307200 ] && echo "$f"; done || true)
          if [ -n "$big" ]; then
            echo "Files over 300 KB under docs/screenshots/:"; echo "$big"; exit 1
          fi

      - name: Verify re-inclusions in .gitignore are the known set
        run: |
          # Every `!` line in .gitignore must have a check above. Adding one
          # without its check is the whole failure mode.
          allowed='^!(frontend/public/\*\*|docs/screenshots/\*\.png|\.env\.example)$'
          bad=$(grep -E '^!' .gitignore | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected re-inclusion in .gitignore:"; echo "$bad"; exit 1
          fi
