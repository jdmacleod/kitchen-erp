name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: kerp_owner
          POSTGRES_PASSWORD: ci-owner-pw
          POSTGRES_DB: kerp
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U kerp_owner -d kerp"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://kerp_app:ci-app-pw@127.0.0.1:5433/kerp
      MIGRATION_DATABASE_URL: postgresql+asyncpg://kerp_owner:ci-owner-pw@127.0.0.1:5433/kerp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Create the runtime role
        run: |
          PGPASSWORD=ci-owner-pw psql -h 127.0.0.1 -p 5433 -U kerp_owner -d kerp \
            -c "CREATE ROLE kerp_app LOGIN PASSWORD 'ci-app-pw'" \
            -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC"
      - name: Lint
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
      # Size limits (CODING_STANDARDS.md). tools/ is linted by pre-commit with ruff's
      # defaults; it joins the backend's configuration here with the formatting PR.
      - name: File size limits
        run: python3 -m tools.check_size
      - name: Test
        working-directory: backend
        run: uv run pytest -q

  config:
    name: Config contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # A setting documented in .env.example but absent from compose.yaml is
      # silently ignored at runtime. Cheap to check, invisible when it breaks.
      - run: python -m tools.check_compose_env

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      # Again, now that corepack provides pnpm: setup-node's pnpm cache asks pnpm
      # for its store path, which the first call could not.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install, lint, test, build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # `git describe --tags` needs the tags; the default depth-1
          # checkout fetches none, so every build falls back to a bare sha.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Start the stack
        # Compose cannot run git, so the build identity is resolved here. Without
        # it every CI image reports "dev" and the build-identity e2e spec fails.
        run: |
          cp .env.example .env
          BUILD_COMMIT=$(git rev-parse --short HEAD)
          BUILD_VERSION=$(git describe --tags --always --dirty)
          export BUILD_COMMIT BUILD_VERSION
          echo "building $BUILD_VERSION ($BUILD_COMMIT)"
          # The recipes mount: the example recipes, as compose.e2e.yaml mounts
          # them for `make e2e`. The shell wins over .env in Compose, and the
          # default ./data/recipes does not exist on a fresh checkout.
          export RECIPES_PATH=./examples/recipes
          docker compose up -d --build
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/api/v1/health >/dev/null && break; sleep 2; done
          docker compose exec -T api kerp migrate
          docker compose exec -T api kerp seed units
          docker compose exec -T api kerp create-admin --email admin@example.com --display-name Admin --password local-dev-admin-pw
      - name: Run Playwright
        working-directory: e2e
        env:
          # This job's stack is fresh and thrown away with the runner, so the
          # suite runs on the default port rather than the local e2e stack's.
          E2E_BASE_URL: http://127.0.0.1:8080
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

  types:
    name: Types (advisory)
    runs-on: ubuntu-latest
    # ty is beta and advisory (CODING_STANDARDS.md): it reports, it never blocks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: ty check
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ty check --output-format concise > ty.txt 2>&1 || true
          cat ty.txt
          found=$(grep -E '^Found [0-9]+ diagnostic' ty.txt || echo "No diagnostics")
          {
            echo "### ty (advisory)"
            echo
            echo "$found on this commit. ty gates nothing yet; see CODING_STANDARDS.md."
          } >> "$GITHUB_STEP_SUMMARY"

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # actionlint at the version .pre-commit-config.yaml pins, built by pre-commit;
      # it runs shellcheck over every run: block too.
      - name: actionlint
        run: uvx pre-commit@4.6.0 run actionlint --all-files --show-diff-on-failure
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.30.1 --format=github .github/workflows
