# Synthetic receipt. Vendor, address, phone, card and items are invented (SECURITY.md).
name: poor_ocr
notes: |
  Deliberately poor OCR of a Harborview Market receipt: zeros read as the
  letter O, ones as l, broken lines, and a misread price (9.47 read as 9.4l,
  which the model records as 9.41). The lines therefore do not sum to the
  printed total, so the purchase is flagged reconcile_mismatch and still
  reaches review. Street name is invented.
