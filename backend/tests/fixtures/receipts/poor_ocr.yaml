  - {seq: 3, raw_text: "CHKN THlGHS B/S 9.4l F", line_kind: item, qty: "1", unit: each, unit_price: null, line_total: "9.41", parent_seq: null}
  - {seq: 4, raw_text: "BANANAS 2.O5 lb @ O.69/lb 1.4l", line_kind: item, qty: "2.05", unit: lb, unit_price: "0.69", line_total: "1.41", parent_seq: null}
  - {seq: 5, raw_text: "ITAL BRD L0AF 3.49 F", line_kind: item, qty: "1", unit: each, unit_price: null, line_total: "3.49", parent_seq: null}
  - {seq: 6, raw_text: "TAX O.OO", line_kind: tax, qty: null, unit: null, unit_price: null, line_total: "0.00", parent_seq: null}
