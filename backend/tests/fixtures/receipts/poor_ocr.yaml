  ST0RE #O412  12OO HARBOR VISTA BLVD
  (555) 555-O142
  O3/O9/2026 18:O1 REG 2 TRN 4S12
  ORG WH0LE MILK 1GAL 5.99 F
   HRBV CARD SAVlNGS 1.OO-
  CHKN THlGHS B/S 9.4l F
  BANANAS
  2.O5 lb @ O.69/lb 1.4l
  ITAL BRD L0AF 3.49 F
  SUBT0TAL l9.36
  TAX O.OO
  T0TAL l9.36
  VlSA ************0000 l9.36
