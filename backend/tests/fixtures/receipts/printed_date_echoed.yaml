# Synthetic receipt. Vendor and items are invented (SECURITY.md).
name: printed_date_echoed
notes: |
  The model returns the purchase date as the till printed it (MM/DD/YY with
  seconds) instead of the ISO form it was asked for. This is what gpt-oss:20b
  did on most real receipts (#58). Read with RECEIPT_DATE_ORDER=MDY, the
  default, the purchase keeps its date instead of taking the upload time.
ocr_text: |
  HARBOURSIDE PROVISIONS
  STORE 0217
  OAT MILK 1L            3.49
  RYE BREAD              4.25
  SUBTOTAL               7.74
  TOTAL                  7.74
  07/04/26 17:42:09  0217 03 1181
