# Synthetic receipt. Vendor and items are invented (SECURITY.md).
name: two_line_quantities
notes: |
  A till that prints a weighed or counted item on two rows (#87): the weight or
  count first, then the item with its price, and once the other way round, the
  name first and the weight with the price beneath it. The recorded model answer
  does what gpt-oss:20b did on real receipts of this layout: every row is a line
  of its own at the full price, and a count row is read as a saving on the item
  above it. The stage joins each quantity row to its item on the printed
  arithmetic, so each item is one line with its printed quantity and the lines
  add up to the printed total.
ocr_text: |
  LANTERN ROW GROCERY
  STORE 0412
  03/20/26 11:05
  2.71 lb @ 3.99 /lb
  WT BROCCOLI CROWNS      10.81 F
  5 @ 0.79
  AVOCADO                  3.95 F
  BANANAS
    2.31 lb @ 0.69/lb      1.59 F
  OAT MILK 1L              3.49 F
  SUBTOTAL                19.84
  TOTAL                   19.84
  DEBIT                   19.84
