  - {seq: 2, raw_text: "AVOCADO                  3.95 F", line_kind: item, qty: "5", unit: each, unit_price: "0.79", line_total: "3.95", parent_seq: null}
  - {seq: 3, raw_text: "BANANAS", line_kind: item, qty: "2.31", unit: lb, unit_price: "0.69", line_total: "1.59", parent_seq: null}
  - {seq: 4, raw_text: "OAT MILK 1L              3.49 F", line_kind: item, qty: "1", unit: each, unit_price: null, line_total: "3.49", parent_seq: null}
