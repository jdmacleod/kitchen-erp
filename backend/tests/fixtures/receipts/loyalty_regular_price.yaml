# Synthetic receipt. Vendor and items are invented (SECURITY.md).
name: loyalty_regular_price
notes: |
  A loyalty-card supermarket layout (#64): each discounted item prints what was
  paid, then its regular price, then the card saving. The balance is the sum of
  what was paid. The recorded model answer does what gpt-oss:20b did on a real
  receipt of this layout: each Regular Price row as another item, each saving as
  a discount off the already-net amount. The stage folds each trio back: the
  regular-price row goes, the item takes the regular price, and the saving
  attaches to it as a discount, so the lines reconcile and the observation is
  the net price marked as a promotion.
