# Synthetic receipt. Vendor, codes and items are invented (SECURITY.md).
name: price_and_you_pay
notes: |
  A till that prints two prices on each item's row, Price and You Pay, with the
  club saving beneath it for information: You Pay already has the saving off,
  and the balance is the You Pay column. Weighed items print their weight on the
  row below. The recorded model answer does what qwen2.5:14b did on real
  receipts of this layout: each item's raw_text is its name alone, without its
  code or either price, a weight row is an item of its own at nothing, and the
  last saving sits under a weight row. The stage matches each line to its
  printed row, joins the weights on the printed arithmetic, and counts each
  saving as already in its item's price, so the lines add up to the balance.
