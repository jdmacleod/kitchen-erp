# Synthetic receipt. Vendor and items are invented (SECURITY.md).
name: independent_minimal
notes: |
  Small independent shop with mixed-case names, no store number, no address,
  no tax line, a weighed line on one row, and a bag fee. The header carries no
  identifier, so location matching relies on the merchant name (and capture
  coordinates when present).
ocr_text: |
  Rosalind's Corner Grocery
  Thank you!
  3/22/2026 4:05 PM
  Sourdough loaf        6.50
  Local honey 12oz      9.00
  Butter 1lb            5.75
  Apples 2.04 lb @ 1.50/lb   3.06
  Bag fee               0.10
  Total                24.41
  Cash                 25.00
  Change                0.59
