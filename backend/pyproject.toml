[project]
name = "kitchen-erp"
version = "0.1.0"
description = "Self-hosted household kitchen system: vendors, products, purchases, price history."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "typer>=0.12",
    "httpx>=0.27",
    "uuid6>=2024.1.12",
    "python-multipart>=0.0.9",
    "opening-hours-py>=1.0",
]

[project.scripts]
kerp = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=1.0",
    "hypothesis>=6.100",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "llm: needs a live language model (opt-in)",
    "realdata: needs real exports under data/imports (opt-in, never CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "PLW"]
