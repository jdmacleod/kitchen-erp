[project]
name = "kitchen-erp"
version = "0.1.0"
description = "Self-hosted household kitchen system: vendors, products, purchases, price history."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "typer>=0.12",
    "httpx>=0.27",
    "uuid6>=2024.1.12",
    "python-multipart>=0.0.9",
    "opening-hours-py>=1.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "pypdfium2>=5.13.0",
    "pillow-heif>=1.8.0",
    "pmtiles>=3.8,<4",
    "zxing-cpp>=2.3",
    "dulwich>=1.2.17",
]

[project.scripts]
kerp = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=1.0",
    "hypothesis>=6.100",
    "ruff>=0.16,<0.17",
    "ty==0.0.86",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "llm: needs a live language model (opt-in)",
    "realdata: needs real exports under data/imports (opt-in, never CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

# One rule set for backend/ and tools/ (tools/ruff.toml extends this file). The
# rules, the families left out and the noqa baseline are explained in
# CODING_STANDARDS.md, section 3. Existing findings carry `# noqa` comments that
# may only be removed.
[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "C4", "SIM", "PLW", "PLE",
    "PLR0912", "PLR0915", "C90", "RUF", "ASYNC", "PT", "S", "TID", "PTH", "ERA",
]
ignore = [
    # One `assert a and b` per check reads fine in a test; splitting ~930 of them
    # buys nothing.
    "PT018",
]
# Receipt and recipe text is typographic: quantities use ×, ranges an en dash,
# and the parsers name the quote, minus and fraction characters they handle.
allowed-confusables = ["×", "–", "−", "’", "‘", "ʼ", "´", "⁄"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-statements = 50
max-branches = 15

[tool.ruff.lint.per-file-ignores]
# Tests assert, and build their SQL from fixed fragments.
"tests/**" = ["S101", "S608"]
# Migrations compose DDL and backfills from constants in the migration itself.
"alembic/versions/**" = ["S608"]

# ty is advisory (CODING_STANDARDS.md, Python): `make types` and the CI job
# "Types (advisory)" report its findings without failing anything.
[tool.ty.environment]
# The repository root, so tests that import the stdlib-only `tools` package resolve.
extra-paths = [".."]
