# A throwaway stack holding nothing but the synthetic household.
#
# The household's own deployment and this one share no volume, no database, and
# no port. That separation is the point: screenshots for a public repository, and
# a stranger's first look at the UI, must never be taken from real data. Bring it
# up with `make demo-up`, which is `docker compose` across both files.
#
#     docker compose -f compose.yaml -f compose.demo.yaml up -d --build
#
# Every port binds to 127.0.0.1, including the web UI, because a demo is for the
# machine it runs on.
name: kerp-demo

# A default for the demo's passwords, so `make demo-up` works on a fresh clone
# with no .env at all. That is the README's promise and it used to be false:
# with no .env the two DB_*_PASSWORD variables expanded to empty strings,
# Postgres refused to initialise without a password, and the first command a new
# reader runs died with "dependency failed to start" and nothing pointing at the
# cause.
#
# These are defaults rather than fixed values on purpose. Postgres only applies
# POSTGRES_PASSWORD when it initialises a volume, so hardcoding would break
# anyone who already has a demo volume made with their own .env: the database
# would keep the old password while the api connected with the new one. Falling
# back to the same variables keeps an existing demo working and gives a fresh
# clone something that is not the empty string.
#
# They are not secrets. The demo holds invented data, binds to localhost only,
# and its volumes are deleted by `make demo-down`.

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-demo-only-not-a-secret}
      KERP_APP_PASSWORD: ${DB_APP_PASSWORD:-demo-only-not-a-secret}
    volumes: !override
      - demo-db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports: !override
      - "127.0.0.1:${DEMO_DB_PORT:-5434}:5432"

  api:
    environment:
      DATABASE_URL: postgresql+asyncpg://kerp_app:${DB_APP_PASSWORD:-demo-only-not-a-secret}@db:5432/kerp
      MIGRATION_DATABASE_URL: postgresql+asyncpg://kerp_owner:${DB_OWNER_PASSWORD:-demo-only-not-a-secret}@db:5432/kerp
    volumes: !override
      - demo-data:/data
      - ./docs:/srv/docs:ro
    ports: !override
      - "127.0.0.1:${DEMO_API_PORT:-8001}:8000"

  worker:
    environment:
      DATABASE_URL: postgresql+asyncpg://kerp_app:${DB_APP_PASSWORD:-demo-only-not-a-secret}@db:5432/kerp
      MIGRATION_DATABASE_URL: postgresql+asyncpg://kerp_owner:${DB_OWNER_PASSWORD:-demo-only-not-a-secret}@db:5432/kerp
    volumes: !override
      - demo-data:/data

  web:
    volumes: !override
      - demo-tiles:/tiles:ro
    ports: !override
      - "127.0.0.1:${DEMO_WEB_PORT:-8081}:80"

volumes:
  demo-db-data:
  demo-data:
  demo-tiles:
