# A throwaway stack for the browser tests.
#
# The Playwright suite creates vendors, products, ingredients, purchases and
# prices, and the app cannot delete any of them: catalog rows are deactivated,
# and prices are append-only. Run against the household's own stack, every run
# left dozens of "E2E ..." rows behind in the real database. So the suite gets
# its own Compose project, with its own volumes and ports, created fresh by
# `make e2e` and deleted (volumes included) when the run ends.
#
#     docker compose -f compose.yaml -f compose.e2e.yaml up -d --build
#
# Nothing here is a secret: the database lives only for one test run, and every
# port binds to 127.0.0.1.
name: kerp-e2e

x-e2e-db-urls: &e2e-db-urls
  DATABASE_URL: postgresql+asyncpg://kerp_app:e2e-only-not-a-secret@db:5432/kerp
  MIGRATION_DATABASE_URL: postgresql+asyncpg://kerp_owner:e2e-only-not-a-secret@db:5432/kerp
  # No model server, as in CI: a test must never read a receipt with a live
  # model, and the household's OLLAMA_BASE_URL may point at one.
  OLLAMA_BASE_URL: http://127.0.0.1:9

services:
  db:
    environment:
      POSTGRES_PASSWORD: e2e-only-not-a-secret
      KERP_APP_PASSWORD: e2e-only-not-a-secret
    volumes: !override
      - e2e-db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports: !override
      - "127.0.0.1:${E2E_DB_PORT:-5435}:5432"

  api:
    environment: *e2e-db-urls
    volumes: !override
      - e2e-data:/data
      - ./docs:/srv/docs:ro
    ports: !override
      - "127.0.0.1:${E2E_API_PORT:-8002}:8000"

  worker:
    environment: *e2e-db-urls
    volumes: !override
      - e2e-data:/data

  web:
    volumes: !override
      - e2e-tiles:/tiles:ro
    ports: !override
      - "127.0.0.1:${E2E_WEB_PORT:-8082}:80"

volumes:
  e2e-db-data:
  e2e-data:
  e2e-tiles:
