# A throwaway stack for the browser tests.
#
# The Playwright suite creates vendors, products, ingredients, purchases and
# prices, and the app cannot delete any of them: catalog rows are deactivated,
# and prices are append-only. Run against the household's own stack, every run
# left dozens of "E2E ..." rows behind in the real database. So the suite gets
# its own Compose project, with its own volumes and ports, created fresh by
# `make e2e` and deleted (volumes included) when the run ends.
#
#     docker compose -f compose.yaml -f compose.e2e.yaml up -d --build
#
# Nothing here is a secret: the database lives only for one test run, and every
# port binds to 127.0.0.1.
name: kerp-e2e

# Every application setting is pinned here, not taken from the household's .env:
# Compose merges this block over the base one, so anything left out would
# inherit that household's values (an outbound integration turned on, another
# timezone), and the suite would behave differently on each machine. These are
# the .env.example defaults, which is also what CI runs with.
x-e2e-env: &e2e-env
  DATABASE_URL: postgresql+asyncpg://kerp_app:e2e-only-not-a-secret@db:5432/kerp
  MIGRATION_DATABASE_URL: postgresql+asyncpg://kerp_owner:e2e-only-not-a-secret@db:5432/kerp
  # No model server, as in CI: a test must never read a receipt with a live
  # model, and the household's OLLAMA_BASE_URL may point at one.
  OLLAMA_BASE_URL: http://127.0.0.1:9
  LLM_MODEL: gpt-oss:20b
  VISION_MODEL: ""
  OCR_VISION_MODEL: glm-ocr
  OCR_VISION_TIMEOUT_SECONDS: "300"
  ENABLE_OVERPASS: "false"
  ENABLE_NOMINATIM: "false"
  HOUSEHOLD_TIMEZONE: America/Los_Angeles
  RECEIPT_DATE_ORDER: MDY
  CURRENCY: USD
  MEDIA_PATH: /data/media
  INGEST_LOCK_TIMEOUT_SECONDS: "600"
  INGEST_STALL_MINUTES: "10"
  LLM_TIMEOUT_SECONDS: "120"
  LLM_CONNECT_TIMEOUT_SECONDS: "5"
  LLM_LINES_SECONDS_PER_LINE: "3"
  LLM_MAX_RETRIES: "2"
  OCR_ADAPTERS: '["client","tesseract"]'
  PRODUCT_ADAPTERS: '[]'
  PRODUCTS_AUTOQUEUE_GTINS: "false"
  LISTING_REFRESH_DAYS: "7"
  INGEST_MAX_ATTEMPTS: "5"
  INGEST_BACKOFF_BASE_SECONDS: "5"
  INGEST_BACKOFF_FACTOR: "4"
  INGEST_BACKOFF_MAX_SECONDS: "300"
  INGEST_LOCATION_RADIUS_M: "300"
  COOKIE_SECURE: "false"
  LOG_LEVEL: INFO

services:
  db:
    environment:
      POSTGRES_PASSWORD: e2e-only-not-a-secret
      KERP_APP_PASSWORD: e2e-only-not-a-secret
    volumes: !override
      - e2e-db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports: !override
      - "127.0.0.1:${E2E_DB_PORT:-5435}:5432"

  api:
    environment: *e2e-env
    volumes: !override
      - e2e-data:/data
      - ./docs:/srv/docs:ro
    ports: !override
      - "127.0.0.1:${E2E_API_PORT:-8002}:8000"

  worker:
    environment: *e2e-env
    volumes: !override
      - e2e-data:/data

  web:
    volumes: !override
      - e2e-tiles:/tiles:ro
    ports: !override
      - "127.0.0.1:${E2E_WEB_PORT:-8082}:80"

volumes:
  e2e-db-data:
  e2e-data:
  e2e-tiles:
